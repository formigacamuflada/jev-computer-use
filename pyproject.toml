[project]
name = "jevcu"
version = "0.1.0"
description = "Computer use por voz no Windows: Cua Driver observa e age, TypeSafe Jev decide."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
winrt = ["winsdk>=1.0.0b10"]
whisper = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.26"]
dev = ["pytest>=8.0"]

[project.scripts]
jevcu = "jevcu.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
